    <script>
        // Data structure for the 6 Axes based on Tanaka's evaluation standard
        const CRITERIA = [
            {
                key: 'beautiful',
                label: '美しい',
                note: '醜い美しさ、儚い美しさなどもある',
                icon: 'fa-wand-magic-sparkles',
                color: '#ec4899', // pink
                value: 3
            },
            {
                key: 'captivating',
                label: '惹きつける',
                note: '動き、構図、かたちや色彩の妙、構想力など',
                icon: 'fa-magnet',
                color: '#8b5cf6', // purple
                value: 3
            },
            {
                key: 'diverse_viewpoints',
                label: '多様な視点が提供されている',
                note: '多様な引き出しがあり、経験や感性に応じた解釈・見方ができる',
                icon: 'fa-cubes',
                color: '#3b82f6', // blue
                value: 3
            },
            {
                key: 'historical',
                label: '歴史性を踏まえている',
                note: '革新性や意外性も含まれる',
                icon: 'fa-landmark',
                color: '#10b981', // emerald
                value: 3
            },
            {
                key: 'inexpressible',
                label: '言語化できない',
                note: '言葉を超えた的確な表現手段',
                icon: 'fa-comment-slash',
                color: '#f59e0b', // amber
                value: 3
            },
            {
                key: 'deeply_touching',
                label: '心に沁みる',
                note: '味わい深く、飽きがこない',
                icon: 'fa-heart',
                color: '#ef4444', // red
                value: 3
            }
        ];

        // Default sample photos
        const SAMPLES = [
            'https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=600&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=600&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1578926375605-eaf7559b1458?w=600&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1582562124811-c091b7a0a00d?w=600&auto=format&fit=crop'
        ];

        // IndexedDB Storage Engine for 30 high-res photos & data
        const DB_NAME = 'ArtContestDB';
        const STORE_NAME = 'entries';
        let db = null;

        let currentEntryId = 1; // 1 to 30
        let entriesData = {}; // Memory cache of all 30 entries
        let radarChartInstance = null;
        let lastEvaluatorName = ''; // Shared evaluator name across entries

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve();
                };
                request.onerror = (e) => reject(e);
            });
        }

        async function loadAllEntriesFromDB() {
            return new Promise((resolve) => {
                if (!db) return resolve({});
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => {
                    const list = req.result || [];
                    const map = {};
                    list.forEach(item => { map[item.id] = item; });
                    resolve(map);
                };
                req.onerror = () => resolve({});
            });
        }

        async function saveEntryToDB(entryObj) {
            return new Promise((resolve) => {
                if (!db) return resolve();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put(entryObj);
                tx.oncomplete = () => resolve();
            });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await initDB();
                entriesData = await loadAllEntriesFromDB();
            } catch (err) {
                console.error('DB initialization failed:', err);
            }

            // Ensure 30 entry slots exist in memory
            for (let i = 1; i <= 30; i++) {
                if (!entriesData[i]) {
                    entriesData[i] = createEmptyEntry(i);
                }
            }

            setupEntrySelectors();
            renderSliders();
            renderGuideModalList();
            initChart();
            
            // Load Entry 1
            loadEntryToForm(1);
            setupEventListeners();
            updateLogCount();
        });

        function createEmptyEntry(id) {
            return {
                id: id,
                title: `作品 No.${id}`,
                evaluator: lastEvaluatorName || '',
                artist: '',
                location: '絵画コンテスト',
                firstImpression: '',
                memo: '',
                imgSrc: SAMPLES[(id - 1) % SAMPLES.length],
                scores: CRITERIA.map(c => ({ key: c.key, label: c.label, value: 3 })),
                updatedAt: new Date().toISOString()
            };
        }

        function setupEntrySelectors() {
            const dropdown = document.getElementById('select-entry-dropdown');
            const pillsContainer = document.getElementById('entry-pills-container');
            dropdown.innerHTML = '';
            pillsContainer.innerHTML = '';

            for (let i = 1; i <= 30; i++) {
                // Dropdown option
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `No.${i} - ${entriesData[i]?.title || '作品 No.' + i}`;
                dropdown.appendChild(opt);

                // Quick pill
                const pill = document.createElement('button');
                pill.id = `pill-entry-${i}`;
                pill.className = `entry-pill shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold border border-slate-700 bg-slate-950 text-slate-300 hover:border-purple-500 transition`;
                pill.innerText = `${i}`;
                pill.onclick = () => switchEntry(i);
                pillsContainer.appendChild(pill);
            }
        }

        function updatePillsState() {
            document.querySelectorAll('.entry-pill').forEach(btn => btn.classList.remove('active'));
            const activePill = document.getElementById(`pill-entry-${currentEntryId}`);
            if (activePill) activePill.classList.add('active');

            const dropdown = document.getElementById('select-entry-dropdown');
            if (dropdown) dropdown.value = currentEntryId;

            document.getElementById('current-entry-badge').innerText = `No. ${currentEntryId} / 30`;
        }

        function renderSliders() {
            const container = document.getElementById('sliders-container');
            container.innerHTML = '';

            CRITERIA.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'bg-slate-950/70 p-3 rounded-xl border border-slate-800 space-y-2';
                row.innerHTML = `
                    <div class="flex justify-between items-center text-xs">
                        <div class="flex items-center space-x-2">
                            <span class="w-6 h-6 rounded-lg flex items-center justify-center text-xs text-white" style="background-color: ${item.color}33; color: ${item.color}">
                                <i class="fa-solid ${item.icon}"></i>
                            </span>
                            <span class="font-bold text-slate-200">${item.label}</span>
                        </div>
                        <span id="value-display-${index}" class="font-bold text-sm text-purple-400 bg-purple-950/50 px-2 py-0.5 rounded border border-purple-800/40">${item.value}</span>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="text-[10px] text-slate-500">1</span>
                        <input type="range" id="slider-${index}" min="1" max="5" step="1" value="${item.value}" 
                               class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-purple-500">
                        <span class="text-[10px] text-slate-500">5</span>
                    </div>
                    <p class="text-[11px] text-slate-400 pl-1 leading-snug">
                        <span class="text-slate-500">※</span> ${item.note}
                    </p>
                `;
                container.appendChild(row);

                setTimeout(() => {
                    const slider = document.getElementById(`slider-${index}`);
                    slider.addEventListener('input', (e) => {
                        const val = parseInt(e.target.value);
                        CRITERIA[index].value = val;
                        document.getElementById(`value-display-${index}`).innerText = val;
                        updateChart();
                        updateAvgAndTop();
                        autoSaveCurrentEntry();
                    });
                }, 0);
            });
        }

        function initChart() {
            const ctx = document.getElementById('radarChart').getContext('2d');
            
            radarChartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: CRITERIA.map(c => c.label),
                    datasets: [{
                        label: '評価スコア',
                        data: CRITERIA.map(c => c.value),
                        backgroundColor: 'rgba(139, 92, 246, 0.25)',
                        borderColor: '#8b5cf6',
                        borderWidth: 2,
                        pointBackgroundColor: '#ec4899',
                        pointBorderColor: '#ffffff',
                        pointHoverBackgroundColor: '#ffffff',
                        pointHoverBorderColor: '#ec4899',
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255, 255, 255, 0.15)' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            pointLabels: {
                                color: '#e2e8f0',
                                font: { size: 10, weight: 'bold' }
                            },
                            ticks: {
                                color: '#94a3b8',
                                backdropColor: 'transparent',
                                stepSize: 1,
                                min: 0,
                                max: 5,
                                font: { size: 9 }
                            },
                            suggestedMin: 0,
                            suggestedMax: 5
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#e2e8f0',
                            bodyColor: '#a7f3d0'
                        }
                    }
                }
            });
        }

        function updateChart() {
            if (!radarChartInstance) return;
            radarChartInstance.data.datasets[0].data = CRITERIA.map(c => c.value);
            radarChartInstance.update();
        }

        function updateAvgAndTop() {
            const values = CRITERIA.map(c => c.value);
            const sum = values.reduce((a, b) => a + b, 0);
            const avg = (sum / values.length).toFixed(1);
            document.getElementById('score-avg').innerText = avg;

            let maxVal = -1;
            let topItem = CRITERIA[0].label;
            CRITERIA.forEach(c => {
                if (c.value > maxVal) {
                    maxVal = c.value;
                    topItem = c.label;
                }
            });
            document.getElementById('score-top-item').innerText = topItem;
        }

        function loadEntryToForm(id) {
            currentEntryId = id;
            updatePillsState();

            const data = entriesData[id] || createEmptyEntry(id);

            document.getElementById('art-title').value = data.title || `作品 No.${id}`;
            document.getElementById('art-evaluator').value = data.evaluator || lastEvaluatorName || '';
            document.getElementById('art-artist').value = data.artist || '';
            document.getElementById('art-location').value = data.location || '絵画コンテスト';
            document.getElementById('art-first-impression').value = data.firstImpression || '';
            document.getElementById('art-memo').value = data.memo || '';
            document.getElementById('artwork-img').src = data.imgSrc || SAMPLES[0];

            // Apply scores
            if (data.scores && Array.isArray(data.scores)) {
                data.scores.forEach((s, idx) => {
                    if (CRITERIA[idx]) {
                        CRITERIA[idx].value = s.value;
                        const slider = document.getElementById(`slider-${idx}`);
                        if (slider) slider.value = s.value;
                        const disp = document.getElementById(`value-display-${idx}`);
                        if (disp) disp.innerText = s.value;
                    }
                });
            }

            updateChart();
            updateAvgAndTop();
        }

        function switchEntry(id) {
            if (id < 1 || id > 30) return;
            autoSaveCurrentEntry();
            loadEntryToForm(id);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function autoSaveCurrentEntry() {
            const title = document.getElementById('art-title').value || `作品 No.${currentEntryId}`;
            const evaluator = document.getElementById('art-evaluator').value || '';
            const artist = document.getElementById('art-artist').value || '';
            const location = document.getElementById('art-location').value || '';
            const firstImpression = document.getElementById('art-first-impression').value || '';
            const memo = document.getElementById('art-memo').value || '';
            const imgSrc = document.getElementById('artwork-img').src;

            if (evaluator) {
                lastEvaluatorName = evaluator;
            }

            const entryObj = {
                id: currentEntryId,
                title,
                evaluator,
                artist,
                location,
                firstImpression,
                memo,
                imgSrc,
                scores: CRITERIA.map(c => ({ key: c.key, label: c.label, value: c.value })),
                updatedAt: new Date().toISOString()
            };

            entriesData[currentEntryId] = entryObj;
            saveEntryToDB(entryObj);
            updateLogCount();

            // Update dropdown label
            const option = document.querySelector(`#select-entry-dropdown option[value="${currentEntryId}"]`);
            if (option) option.textContent = `No.${currentEntryId} - ${title}`;
        }

        function setupEventListeners() {
            // Dropdown switcher
            document.getElementById('select-entry-dropdown').addEventListener('change', (e) => {
                switchEntry(parseInt(e.target.value));
            });

            document.getElementById('btn-prev-entry').addEventListener('click', () => switchEntry(currentEntryId - 1));
            document.getElementById('btn-next-entry').addEventListener('click', () => switchEntry(currentEntryId + 1));

            // Copy Full HTML Code to Clipboard for easy GitHub upload
            document.getElementById('btn-copy-code').addEventListener('click', () => {
                const fullHtml = document.documentElement.outerHTML;
                const textarea = document.createElement('textarea');
                textarea.value = '<!DOCTYPE html>\n' + fullHtml;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('全コードをコピーしました！GitHubに貼り付け可能です');
                } catch (err) {
                    showToast('コピーに失敗しました');
                }
                document.body.removeChild(textarea);
            });

            // Auto save on inputs
            ['art-title', 'art-evaluator', 'art-artist', 'art-location', 'art-first-impression', 'art-memo'].forEach(id => {
                document.getElementById(id).addEventListener('input', autoSaveCurrentEntry);
            });

            // Camera/Image Upload with canvas compression for smooth storage
            const imageUpload = document.getElementById('image-upload');
            imageUpload.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const img = new Image();
                        img.onload = function() {
                            // Resize to max 800px width/height for fast mobile memory
                            const canvas = document.createElement('canvas');
                            let w = img.width;
                            let h = img.height;
                            const maxDim = 800;
                            if (w > maxDim || h > maxDim) {
                                if (w > h) {
                                    h = Math.round((h * maxDim) / w);
                                    w = maxDim;
                                } else {
                                    w = Math.round((w * maxDim) / h);
                                    h = maxDim;
                                }
                            }
                            canvas.width = w;
                            canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);
                            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.82);
                            document.getElementById('artwork-img').src = compressedBase64;
                            autoSaveCurrentEntry();
                        };
                        img.src = evt.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            // Cycle Sample Images
            document.getElementById('btn-sample-img').addEventListener('click', () => {
                const randomSample = SAMPLES[Math.floor(Math.random() * SAMPLES.length)];
                document.getElementById('artwork-img').src = randomSample;
                autoSaveCurrentEntry();
            });

            // Reset Scores
            document.getElementById('btn-reset-scores').addEventListener('click', () => {
                CRITERIA.forEach((c, idx) => {
                    c.value = 3;
                    document.getElementById(`slider-${idx}`).value = 3;
                    document.getElementById(`value-display-${idx}`).innerText = 3;
                });
                updateChart();
                updateAvgAndTop();
                autoSaveCurrentEntry();
            });

            // Modals
            document.getElementById('btn-guide').addEventListener('click', () => document.getElementById('modal-guide').classList.remove('hidden'));
            document.getElementById('close-guide').addEventListener('click', () => document.getElementById('modal-guide').classList.add('hidden'));
            document.getElementById('close-guide-btn').addEventListener('click', () => document.getElementById('modal-guide').classList.add('hidden'));

            document.getElementById('btn-gallery').addEventListener('click', () => {
                renderGalleryLogs();
                document.getElementById('modal-gallery').classList.remove('hidden');
            });
            document.getElementById('close-gallery').addEventListener('click', () => document.getElementById('modal-gallery').classList.add('hidden'));
            document.getElementById('close-gallery-btn').addEventListener('click', () => document.getElementById('modal-gallery').classList.add('hidden'));

            // Manual Save Button
            document.getElementById('btn-save-log').addEventListener('click', () => {
                autoSaveCurrentEntry();
                showToast(`No.${currentEntryId} の評価・感想を保存しました`);
            });

            // Export Card
            document.getElementById('btn-export-card').addEventListener('click', exportSummaryCard);

            // Export CSV for Google Sheets
            document.getElementById('btn-export-csv').addEventListener('click', exportCSVForSheets);

            // Copy TSV for direct Google Sheets paste
            document.getElementById('btn-copy-tsv').addEventListener('click', copyTSVForSheets);

            // Export All Data JSON (Mobile Storage Download)
            document.getElementById('btn-export-backup').addEventListener('click', exportAllDataJSON);

            // Import Data JSON
            document.getElementById('import-json-file').addEventListener('change', importAllDataJSON);
        }

        // Export CSV for Google Sheets with UTF-8 BOM to prevent Japanese garbling
        function exportCSVForSheets() {
            const headers = [
                '評価者名', '作品No.', '作品名', '作者名', '部門・区分',
                '1.初見感想', '美しい', '惹きつける', '多様な視点',
                '歴史性', '言語化できない', '心に沁みる', '平均点', '最高評価項目', '詳細メモ', '更新日時'
            ];

            const rows = [headers];

            for (let i = 1; i <= 30; i++) {
                const item = entriesData[i] || createEmptyEntry(i);
                const scores = item.scores || [];
                const getVal = (idx) => scores[idx] ? scores[idx].value : 3;
                const avg = scores.length ? (scores.reduce((a,b) => a + b.value, 0) / scores.length).toFixed(1) : '3.0';
                
                let topItem = '惹きつける';
                let maxVal = -1;
                scores.forEach(s => {
                    if (s.value > maxVal) {
                        maxVal = s.value;
                        topItem = s.label;
                    }
                });

                rows.push([
                    item.evaluator || lastEvaluatorName || '',
                    `No.${i}`,
                    item.title || `作品 No.${i}`,
                    item.artist || '',
                    item.location || '',
                    item.firstImpression || '',
                    getVal(0), getVal(1), getVal(2), getVal(3), getVal(4), getVal(5),
                    avg,
                    topItem,
                    item.memo || '',
                    item.updatedAt || ''
                ]);
            }

            // Escape quotes & newlines for CSV
            const csvContent = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
            const bom = '\uFEFF'; // UTF-8 BOM for Google Sheets & Excel
            const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `ArtContest_Evaluation_Sheets_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('スプレッドシート用CSVを出力しました！');
        }

        // Copy Tab-Separated Values (TSV) for direct paste into Google Sheets
        function copyTSVForSheets() {
            const headers = [
                '評価者名', '作品No.', '作品名', '作者名', '部門・区分',
                '1.初見感想', '美しい', '惹きつける', '多様な視点',
                '歴史性', '言語化できない', '心に沁みる', '平均点', '最高評価項目', '詳細メモ'
            ];

            const rows = [headers];

            for (let i = 1; i <= 30; i++) {
                const item = entriesData[i] || createEmptyEntry(i);
                const scores = item.scores || [];
                const getVal = (idx) => scores[idx] ? scores[idx].value : 3;
                const avg = scores.length ? (scores.reduce((a,b) => a + b.value, 0) / scores.length).toFixed(1) : '3.0';
                
                let topItem = '惹きつける';
                let maxVal = -1;
                scores.forEach(s => {
                    if (s.value > maxVal) {
                        maxVal = s.value;
                        topItem = s.label;
                    }
                });

                rows.push([
                    item.evaluator || lastEvaluatorName || '',
                    `No.${i}`,
                    item.title || `作品 No.${i}`,
                    item.artist || '',
                    item.location || '',
                    (item.firstImpression || '').replace(/[\r\n]+/g, ' '),
                    getVal(0), getVal(1), getVal(2), getVal(3), getVal(4), getVal(5),
                    avg,
                    topItem,
                    (item.memo || '').replace(/[\r\n]+/g, ' ')
                ]);
            }

            const tsvText = rows.map(r => r.join('\t')).join('\n');
            
            const textarea = document.createElement('textarea');
            textarea.value = tsvText;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('全30作品の表データをコピーしました！スプレッドシートに貼り付けできます');
            } catch (err) {
                showToast('コピーに失敗しました');
            }
            document.body.removeChild(textarea);
        }

        function updateLogCount() {
            let count = 0;
            for (let i = 1; i <= 30; i++) {
                if (entriesData[i] && (entriesData[i].firstImpression || entriesData[i].artist || entriesData[i].memo)) {
                    count++;
                }
            }
            document.getElementById('log-count').innerText = count;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 2500);
        }

        function exportSummaryCard() {
            const cardEl = document.getElementById('export-card');
            showToast('画像を生成中...');
            html2canvas(cardEl, { backgroundColor: '#0f172a', scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Entry_No${currentEntryId}_Evaluation.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('カード画像を端末に保存しました');
            }).catch(err => {
                console.error(err);
                showToast('画像の生成に失敗しました');
            });
        }

        // Save All 30 Entries as a downloadable JSON file for smartphone storage
        function exportAllDataJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entriesData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `ArtContest_Evaluation_Backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('全データをスマホ本体に保存しました');
        }

        function importAllDataJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    const imported = JSON.parse(evt.target.result);
                    if (typeof imported === 'object') {
                        entriesData = imported;
                        for (let key in entriesData) {
                            await saveEntryToDB(entriesData[key]);
                        }
                        setupEntrySelectors();
                        loadEntryToForm(1);
                        renderGalleryLogs();
                        updateLogCount();
                        showToast('データを復元・読み込みました');
                    }
                } catch (err) {
                    showToast('JSONファイルの読み込みに失敗しました');
                }
            };
            reader.readAsText(file);
        }

        function renderGuideModalList() {
            const container = document.getElementById('guide-list-container');
            container.innerHTML = '';
            CRITERIA.forEach(c => {
                const box = document.createElement('div');
                box.className = 'bg-slate-950/80 p-3 rounded-xl border border-slate-800 space-y-1';
                box.innerHTML = `
                    <div class="font-bold text-slate-200 flex items-center space-x-2">
                        <i class="fa-solid ${c.icon}" style="color:${c.color}"></i>
                        <span>${c.label}</span>
                    </div>
                    <p class="text-slate-400 text-[11px] leading-relaxed pl-5">${c.note}</p>
                `;
                container.appendChild(box);
            });
        }

        function renderGalleryLogs() {
            const container = document.getElementById('gallery-items-container');
            container.innerHTML = '';

            for (let i = 1; i <= 30; i++) {
                const item = entriesData[i] || createEmptyEntry(i);
                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border flex flex-col justify-between space-y-2 text-xs ${i === currentEntryId ? 'bg-purple-950/30 border-purple-500' : 'bg-slate-950 border-slate-800'}`;
                
                const avgScore = item.scores ? (item.scores.reduce((a,b)=>a+b.value,0)/item.scores.length).toFixed(1) : '3.0';

                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-800 pb-1.5">
                        <span class="font-bold text-purple-400">No. ${i}</span>
                        <span class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-300 font-semibold">平均 ${avgScore} 点</span>
                    </div>
                    <div class="flex space-x-2.5 items-center">
                        <img src="${item.imgSrc}" class="w-14 h-14 rounded-lg object-cover bg-slate-900 border border-slate-800 shrink-0">
                        <div class="overflow-hidden flex-1">
                            <h4 class="font-bold text-slate-100 truncate">${item.title}</h4>
                            <p class="text-[11px] text-slate-400 truncate">${item.artist || '作者未入力'}</p>
                        </div>
                    </div>
                    ${item.firstImpression ? `
                        <p class="text-[11px] text-pink-300/90 italic bg-purple-950/40 p-1.5 rounded border border-purple-900/50 line-clamp-2">
                            <i class="fa-solid fa-eye mr-1 text-[9px]"></i>"${item.firstImpression}"
                        </p>
                    ` : '<p class="text-[10px] text-slate-600 italic">初見感想未記入</p>'}
                    <div class="pt-1 border-t border-slate-800/80 flex justify-end">
                        <button onclick="selectAndCloseModal(${i})" class="text-xs text-purple-400 hover:text-purple-300 flex items-center space-x-1">
                            <i class="fa-solid fa-pen-to-square"></i>
                            <span>編集・評価</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        window.selectAndCloseModal = function(id) {
            switchEntry(id);
            document.getElementById('modal-gallery').classList.add('hidden');
        };
    </script>
</body>
</html>
